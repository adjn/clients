
# This workflow runs fork PR desktop builds from the target context, but intentionally does not
# inherit secrets or grant OIDC/write scopes to PR-head code.

name: Build Desktop on PR Target

permissions: {}

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'libs/**'
      - '*'
      - '!*.md'
      - '!*.txt'
      - '.github/workflows/build-desktop.yml'

defaults:
  run:
    shell: bash

jobs:
  check-run:
    name: Check PR run
    uses: bitwarden/gh-actions/.github/workflows/check-run.yml@bf687f1106a40cc778516d5fe23a5df7b283baf2
    permissions:
      contents: read

  run-workflow:
    name: Build Desktop
    needs: check-run
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    uses: ./.github/workflows/build-desktop.yml
    permissions:
      contents: read
